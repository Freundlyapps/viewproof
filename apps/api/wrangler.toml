name = "viewproof-api"
main = "src/index.ts"
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]

# The React app, built by `pnpm --filter web build` into apps/web/dist/app and served at /app.
# The Worker runs first so /api, /auth and /account are never shadowed; html_handling none so the
# Worker can fetch /app/index.html directly for app routes.
[assets]
directory = "../web/dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "viewproof"
database_id = "local"
migrations_dir = "../../packages/db/migrations"

[vars]
APP_URL = "http://localhost:8787"
SELF_HOSTED = "false"

[triggers]
crons = ["17 * * * *"]

# Data pool archive (plan 5b): pool/YYYY/MM/DD.ndjson.gz, deleted after 36 months by a lifecycle rule (see README).
[[r2_buckets]]
binding = "POOL"
bucket_name = "viewproof-pool"

# The hosted service (viewproof.app): `pnpm --filter web build && npx wrangler deploy --env production`.
# Self-hosters: ignore this section (see README → Self-hosting). Secrets are set with `wrangler secret put … --env production`;
# OPERATOR_NAME, CONTACT_EMAIL and OPERATOR_ADDRESS are set as secrets too, so they live only in Cloudflare.
# No R2 binding yet: the pool archive step is skipped (and the privacy page says so) until R2 is enabled on the account.
[env.production]
routes = [{ pattern = "viewproof.app", custom_domain = true }]

[[env.production.d1_databases]]
binding = "DB"
database_name = "viewproof"
database_id = "e07b2247-4e43-42bc-8f6d-ebad3c628b75"
migrations_dir = "../../packages/db/migrations"

[env.production.vars]
APP_URL = "https://viewproof.app"
SELF_HOSTED = "false"
CRON_FEED_BUDGET = "10"
